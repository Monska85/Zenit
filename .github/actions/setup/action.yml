name: Setup
description: Python with the pinned and hashed tools of requirements-ci.txt and the PlatformIO cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-ci.txt

    # The make targets read these: a runner has no one else to share it with
    - name: Use every core of the runner at normal priority
      shell: bash
      run: |
        echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
        echo "NICE=0" >> "$GITHUB_ENV"

    # The PlatformIO core comes from requirements-ci.txt: a new core starts a new cache
    - name: Cache PlatformIO toolchains and libraries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'lib/*/library.json', 'requirements-ci.txt') }}

    # Every package, dependencies included, at the version and hash of the lock
    - name: Install tools
      shell: bash
      run: pip install --require-hashes -r requirements-ci.txt
