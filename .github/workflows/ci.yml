name: CI

# Every change is checked once: in its pull request, and on main after the merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether a pull request changed anything but documentation. Every other event runs every job. A job skipped by its
  # if: reports success, so the required checks pass; check also runs when this job fails.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A file counts when it matches every pattern: anything outside docs/ that is not Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # actionlint checks the workflows, and the run: blocks with the runner's shellcheck
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release archive of rhysd/actionlint, checked against its SHA-256. Dependabot does not update it: change
      # both values together, the hash from actionlint_<version>_checksums.txt of the same release.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The certificate bundle the firmware embeds is the one Espressif's generator makes from the pinned esp-idf files. It
  # reads them from GitHub, so it is not a required check: a network failure must not block a merge.
  certificates:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Make the bundle again and compare it with the committed one
        run: |
          set -eu
          pip install "$(grep '^cryptography==' requirements-ci.txt)"
          python tools/crt_bundle.py check

  # Formatting, the tool tests, the native tests with the conformance cases, and the firmware and simulator builds
  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The firmware version comes from git describe
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check
        run: make check

      - name: Check that the firmware leaves 64 KiB of its slot free
        run: |
          set -eu
          size=$(stat -c %s .pio/build/esp32c3/firmware.bin)
          # The size of the first application slot in partitions.csv
          slot=$(($(awk -F, '$1 == "app0" { gsub(/ /, "", $5); print $5 }' partitions.csv)))
          echo "firmware $size bytes, slot $slot bytes"
          test $((slot - size)) -ge 65536

      - name: Simulate every effect
        run: |
          set -eu
          for effect in static color_change breathing twinkle fall_asleep christmas; do
            .pio/build/native/program --duration 30 --set effect="$effect" --set timer_minutes=1 \
              --out "sim-out/$effect" > /dev/null
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-traces
          path: sim-out/
          retention-days: 14

  # The web app: types, lint, formatting, unit tests with the conformance cases, the build and its size budget, the
  # end-to-end tests against the simulator, and the reference screenshots (drawn inside the Playwright container)
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Playwright image of the pinned @playwright/test version, by digest. Change both together.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Python, PlatformIO (the simulator the end-to-end tests run) and the bridge's websockets package
      - uses: ./.github/actions/setup

      # The Node version is the one of `engines` in web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the dependencies from the lockfile
        run: make web-install

      - name: Type check, lint, check the formatting, run the unit and conformance tests
        run: make web-test

      - name: Build, and check the size of the JavaScript loaded at start
        run: make web-size

      - name: Install the browser
        run: cd web && npx playwright install --with-deps chromium

      - name: End-to-end tests and layout checks against the simulator
        run: make web-e2e

      - name: Reference screenshots
        run: make web-screenshots

      - name: Keep the Playwright reports of a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            web/playwright-report*/
            web/test-results*/
          if-no-files-found: ignore
          retention-days: 14
