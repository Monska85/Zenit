version: 2
updates:
  # The actions are pinned to commit SHAs with the version in a comment: Dependabot updates both
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The Python tools of CI, pinned in requirements-ci.txt
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The web app, pinned in web/package.json and web/package-lock.json
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    # typescript-eslint does not accept TypeScript 7 yet, and the types of Node follow the Node major in "engines"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      web:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
