version: 2
updates:
  # The actions are pinned to commit SHAs with the version in a comment: Dependabot updates both
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The Python tools of CI, pinned in requirements-ci.txt
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
