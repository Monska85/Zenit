version: 2
updates:
  # The actions are pinned to commit SHAs with the version in a comment: Dependabot updates both
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The Python tools of CI, pinned in requirements-ci.txt
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The web app, pinned in web/package.json and web/package-lock.json
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    # Temporary caps. Each one names the condition that lifts it: when it is met, remove the cap in the same change
    # that takes the new major.
    ignore:
      # Remove when a typescript-eslint release accepts TypeScript 7 (its peer range in 8.73.0: <6.1.0).
      - dependency-name: "typescript"
        versions: [">=7"]
      # Not a temporary cap: the major of the Node types follows "engines" in web/package.json and moves with it, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
