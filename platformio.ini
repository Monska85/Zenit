[platformio]
default_envs = esp32c3

; ---- Firmware ----

; ESP32-C3 SuperMini (docs/reference/hardware.md)
[env:esp32c3]
platform = espressif32@8.0.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
; The web app and the site address (pre), the version and board name for src/ only (post)
extra_scripts =
    pre:scripts/web_assets.py
    post:scripts/firmware_version.py
board_build.partitions = partitions.csv
; The firmware never catches exceptions, so it is built without them and without unwind tables. The platform passes no
; optimization flag to the compiler: -Os applies to our sources, the libraries and the Arduino core.
build_unflags = -std=gnu++11 -fexceptions
build_flags =
    -Os
    -std=gnu++17
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Tests need the simulator: run them with the native_test env
test_ignore = *

; The firmware of the update tests: the same code, but it accepts an http:// site address for a test server on the local
; network (ZENIT_SITE_URL=http://host:port/path/). Never released.
[env:esp32c3_test_http]
extends = env:esp32c3

; ---- Host simulator ----
; The same sources built for this computer, with the LED driver, the clock and the settings memory replaced
; (src/*_sim.cpp).

[env:native]
platform = native@1.2.1
extra_scripts = post:scripts/firmware_version.py
build_flags =
    -std=gnu++17
    -DZENIT_SIM
    ; The host has no Arduino core: keep ArduinoJson to plain C++
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
; Tests run in their own env, so they never overwrite the simulator program
test_ignore = *

; Tests in test/, run on the simulator (pio test -e native_test)
[env:native_test]
extends = env:native
test_ignore =
test_build_src = yes
build_flags =
    ${env:native.build_flags}
    '-DZENIT_PROJECT_DIR="$PROJECT_DIR"'
    ; Helpers shared by the test suites
    -I$PROJECT_DIR/test/support
